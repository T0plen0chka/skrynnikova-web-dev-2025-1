<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказы - Интернет-магазин</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/orders.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Хедер -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo">
                    <i class="fas fa-store"></i>
                    <span>TechShop</span>
                </a>
                
                <div class="header-icons">
                    <a href="index.html" class="home-icon" title="Главная">
                        <i class="fas fa-home"></i>
                    </a>
                    <a href="cart.html" class="cart-icon" title="Корзина">
                        <i class="fas fa-shopping-cart"></i>
                        <span class="cart-count">0</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Область уведомлений -->
    <div class="notifications" id="notifications"></div>

    <main class="container orders-container">
        <h2>Заказы</h2>
        
        <div class="orders-table-container">
            <table class="orders-table" id="orders-table">
                <thead>
                    <tr>
                        <th>№</th>
                        <th>Дата оформления</th>
                        <th>Состав заказа</th>
                        <th>Стоимость</th>
                        <th>Доставка</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="orders-body">
                    <!-- Заказы будут загружены через JS -->
                </tbody>
            </table>
        </div>
        
        <div class="no-orders" id="no-orders">
            <p>У вас пока нет заказов</p>
        </div>
    </main>

    <!-- Модальное окно просмотра заказа -->
    <div class="modal" id="view-order-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Просмотр заказа</h3>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body" id="view-order-content">
                <!-- Содержимое заказа -->
            </div>
            <div class="modal-footer">
                <button class="btn-primary close-modal">Ок</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно редактирования заказа -->
    <div class="modal" id="edit-order-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Редактирование заказа</h3>
                <button class="close-modal">&times;</button>
            </div>
            <form id="edit-order-form">
                <div class="modal-body">
                    <div class="form-group">
                        <label>Дата оформления</label>
                        <input type="text" id="edit-created-at" readonly>
                    </div>
                    <div class="form-group">
                        <label for="edit-name">Имя</label>
                        <input type="text" id="edit-name" name="full_name" required>
                    </div>
                    <div class="form-group">
                        <label for="edit-phone">Номер телефона</label>
                        <input type="tel" id="edit-phone" name="phone" required>
                    </div>
                    <div class="form-group">
                        <label for="edit-email">Email</label>
                        <input type="email" id="edit-email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="edit-address">Адрес доставки</label>
                        <input type="text" id="edit-address" name="delivery_address" required>
                    </div>
                    <div class="form-group">
                        <label for="edit-date">Дата доставки</label>
                        <input type="date" id="edit-date" name="delivery_date" required>
                    </div>
                    <div class="form-group">
                        <label for="edit-interval">Время доставки</label>
                        <select id="edit-interval" name="delivery_interval" required>
                            <option value="08:00-12:00">08:00-12:00</option>
                            <option value="12:00-14:00">12:00-14:00</option>
                            <option value="14:00-18:00">14:00-18:00</option>
                            <option value="18:00-22:00">18:00-22:00</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="edit-comment">Комментарий</label>
                        <textarea id="edit-comment" name="comment" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Состав заказа</label>
                        <div id="edit-order-items"></div>
                    </div>
                    <div class="form-group">
                        <label>Стоимость</label>
                        <input type="text" id="edit-total" readonly>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary close-modal">Отмена</button>
                    <button type="submit" class="btn-primary">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Модальное окно удаления заказа -->
    <div class="modal" id="delete-order-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Удаление заказа</h3>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <p>Вы уверены, что хотите удалить заказ?</p>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary close-modal">Нет</button>
                <button class="btn-danger" id="confirm-delete">Да</button>
            </div>
        </div>
    </div>

    <!-- Футер -->
    <footer class="footer">
        <div class="container">
            <p>TechShop</p>
            <p>Email: support@techshop.ru | Телефон: +7 (000) 000-00-00</p>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/orders.js"></script>
</body>
</html>
