<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интернет-магазин</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Хедер -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-store"></i>
                    <span>TechShop</span>
                </div>
                
                <div class="search-container">
                    <div class="search-box">
                        <input type="text" id="search-input" placeholder="Введите запрос...">
                        <button id="search-btn">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                    <div class="autocomplete-dropdown" id="autocomplete-dropdown"></div>
                </div>
                
                <div class="header-icons">
                    <a href="cart.html" class="cart-icon" title="Корзина">
                        <i class="fas fa-shopping-cart"></i>
                        <span class="cart-count">0</span>
                    </a>
                    <a href="orders.html" class="user-icon" title="Личный кабинет">
                        <i class="fas fa-user"></i>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Область уведомлений -->
    <div class="notifications" id="notifications"></div>

    <main class="container main-container">
        <div class="sidebar">
            <h3>Фильтры</h3>
            
            <!-- Категории -->
            <div class="filter-section">
                <h4>Категории</h4>
                <div class="category-list" id="category-list">
                    <!-- Категории будут загружены через JS -->
                </div>
            </div>
            
            <!-- Стоимость -->
            <div class="filter-section">
                <h4>Стоимость</h4>
                <div class="price-range">
                    <div class="price-input">
                        <label>От</label>
                        <input type="number" id="price-min" min="0" value="100">
                    </div>
                    <div class="price-input">
                        <label>До</label>
                        <input type="number" id="price-max" min="0" value="5000">
                    </div>
                </div>
            </div>
            
            <!-- Скидки -->
            <div class="filter-section">
                <label class="checkbox-label">
                    <input type="checkbox" id="discount-only">
                    <span>Только товары со скидками</span>
                </label>
            </div>
            
            <button class="apply-filters-btn" id="apply-filters">Применить</button>
        </div>
        
        <div class="content">
            <div class="catalog-header">
                <h2>Каталог</h2>
                <select id="sort-select" class="sort-select">
                    <option value="rating_desc">По убыванию рейтинга</option>
                    <option value="rating_asc">По возрастанию рейтинга</option>
                    <option value="price_desc">По убыванию цены</option>
                    <option value="price_asc">По возрастанию цены</option>
                    <option value="discount_desc">По размеру скидки</option>
                </select>
            </div>
            
            <div class="catalog-grid" id="catalog-grid">
                <!-- Товары будут загружены через JS -->
            </div>
        </div>
    </main>

    <!-- Футер -->
    <footer class="footer">
        <div class="container">
            <p>TechShop</p>
            <p>Email: support@techshop.ru | Телефон: +7 (000) 000-00-00</p>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
